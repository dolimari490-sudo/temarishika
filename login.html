<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="STYLES.CSS">
    <script src="https://kit.fontawesome.com/ac9058425e.js" crossorigin="anonymous"></script> 
</head>
 <body>
   <div class="wrapper">
    <form action="" >
        <h1>Sign Up</h1>
        <div class="input-box"> 
            <input type="text" placeholder="username" required> <i class="fa-duotone fa-solid fa-user"></i>
        </div>
        <div class="input-box"> 
            <input type="password" placeholder="password" required>
            <i class="fa-duotone fa-solid fa-lock-keyhole"></i>
        </div>
        <div class="remember-forgot">
            <a href="#" class="forgot-passwrord">forgot password?</a>
            
        </div>
        <button type="submit" class="btn">Get Started</button>
        <div class="register-link">
            <p>or sign in with
                <a href="#">Sign Up</a>
            </p>
        </div>
    </form>
   </div>
    <button onclick="goToHome()">Get Started </button>
    <script>
        function goToHome() {
            window.location.href = "login.html"
        }
    </script>
 </body>
</html>
